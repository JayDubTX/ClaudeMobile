<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus — Project Tracker</title>
<style>
  :root {
    --paper: #f6f2e8;
    --paper-raised: #ffffff;
    --ink: #232019;
    --muted: #746b5c;
    --line: #e4ddcc;
    --line-strong: #cfc6b0;
    --accent: #b5570e;
    --accent-ink: #ffffff;
    --active: #3f7d4f;
    --active-bg: #e7f0e6;
    --blocked: #b23b3b;
    --blocked-bg: #f5e6e2;
    --paused: #6b5f8a;
    --paused-bg: #ebe6f2;
    --done: #4a6b8a;
    --done-bg: #e6edf2;
    --shadow: 0 1px 2px rgba(35,32,25,0.06), 0 4px 12px rgba(35,32,25,0.05);
    --radius: 10px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171310;
      --paper-raised: #211c16;
      --ink: #ece5d4;
      --muted: #a89d89;
      --line: #3a3226;
      --line-strong: #4c4232;
      --accent: #e08a3e;
      --accent-ink: #1a1208;
      --active: #6bb47e;
      --active-bg: #223226;
      --blocked: #e2827a;
      --blocked-bg: #3a2422;
      --paused: #ab9bd6;
      --paused-bg: #2b2638;
      --done: #8fb4d6;
      --done-bg: #1f2c38;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #171310;
    --paper-raised: #211c16;
    --ink: #ece5d4;
    --muted: #a89d89;
    --line: #3a3226;
    --line-strong: #4c4232;
    --accent: #e08a3e;
    --accent-ink: #1a1208;
    --active: #6bb47e;
    --active-bg: #223226;
    --blocked: #e2827a;
    --blocked-bg: #3a2422;
    --paused: #ab9bd6;
    --paused-bg: #2b2638;
    --done: #8fb4d6;
    --done-bg: #1f2c38;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    --paper: #f6f2e8;
    --paper-raised: #ffffff;
    --ink: #232019;
    --muted: #746b5c;
    --line: #e4ddcc;
    --line-strong: #cfc6b0;
    --accent: #b5570e;
    --accent-ink: #ffffff;
    --active: #3f7d4f;
    --active-bg: #e7f0e6;
    --blocked: #b23b3b;
    --blocked-bg: #f5e6e2;
    --paused: #6b5f8a;
    --paused-bg: #ebe6f2;
    --done: #4a6b8a;
    --done-bg: #e6edf2;
    --shadow: 0 1px 2px rgba(35,32,25,0.06), 0 4px 12px rgba(35,32,25,0.05);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card, .chip, button, .note-row { transition: background-color 120ms ease, border-color 120ms ease, transform 120ms ease, opacity 120ms ease; }
  }

  .shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 18px 80px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.9rem;
    letter-spacing: 0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.88rem;
    margin: 2px 0 20px;
  }

  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .stat {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 13px;
    min-width: 74px;
    text-align: left;
  }
  .stat .n {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.25rem;
    font-weight: 600;
    display: block;
    line-height: 1.1;
  }
  .stat .l {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  form.add {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }
  .add-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"], textarea, select {
    font-family: var(--sans);
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 10px 12px;
  }
  input[type="text"]:focus, textarea:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .add-row input[type="text"] {
    flex: 1;
    min-width: 0;
  }
  .add-row select { flex: 0 0 auto; }
  form.add textarea {
    min-height: 40px;
    resize: vertical;
  }

  button {
    font-family: var(--sans);
    font-size: 0.9rem;
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    color: var(--ink);
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  button.primary:hover { opacity: 0.92; }
  button.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
    padding: 6px 8px;
  }
  button.ghost:hover { color: var(--ink); background: var(--line); }
  button.small { padding: 5px 10px; font-size: 0.8rem; }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .chip {
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
  }
  .card-head .grow { flex: 1; min-width: 0; }
  .name {
    font-family: var(--serif);
    font-size: 1.12rem;
    margin: 0 0 4px;
    word-break: break-word;
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .meta .updated { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 999px;
    padding: 3px 10px 3px 8px;
    font-size: 0.74rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .pill::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
  }
  .pill.active { background: var(--active-bg); color: var(--active); }
  .pill.blocked { background: var(--blocked-bg); color: var(--blocked); }
  .pill.paused { background: var(--paused-bg); color: var(--paused); }
  .pill.done { background: var(--done-bg); color: var(--done); }

  .chevron {
    color: var(--muted);
    font-size: 0.8rem;
    padding-top: 3px;
    transform: rotate(0deg);
  }
  .card.open .chevron { transform: rotate(90deg); }

  .body {
    display: none;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .card.open .body { display: block; }

  .status-row, .action-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .notes { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .note-row {
    display: flex;
    gap: 10px;
    font-size: 0.87rem;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
  }
  .note-row:last-child { border-bottom: none; }
  .note-row .ts {
    flex: 0 0 auto;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.74rem;
    padding-top: 2px;
    white-space: nowrap;
  }
  .note-row .txt { flex: 1; min-width: 0; word-break: break-word; }
  .note-row .del { flex: 0 0 auto; }

  form.add-note {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  form.add-note textarea {
    flex: 1;
    min-height: 40px;
    resize: vertical;
  }

  form.edit-project {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    margin-bottom: 12px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
  }
  form.edit-project textarea { min-height: 40px; resize: vertical; }
  .edit-actions { display: flex; gap: 8px; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 16px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    font-size: 0.92rem;
  }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .toolbar .storage-note {
    width: 100%;
    text-align: center;
    color: var(--muted);
    font-size: 0.76rem;
    margin-bottom: 6px;
  }

  .sync-panel {
    margin-top: 28px;
    padding: 14px 16px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .sync-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sync-title {
    font-family: var(--serif);
    font-size: 1rem;
    margin: 0;
  }
  .sync-dot {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .sync-dot::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
  }
  .sync-dot.synced::before { background: var(--active); }
  .sync-dot.error::before { background: var(--blocked); }
  .sync-dot.syncing::before { background: var(--accent); }
  .sync-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .sync-help {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 8px 0 0;
  }
  form.sync-connect {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }
  form.sync-connect input[type="password"] {
    font-family: var(--mono);
    font-size: 0.88rem;
  }

  #importFile { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>Focus</h1>
  </header>
  <p class="tagline">A running list of what you're working on — and what's stalled.</p>

  <div class="stats" id="stats"></div>

  <form class="add" id="addForm">
    <div class="add-row">
      <label class="sr-only" for="newName">Project name</label>
      <input type="text" id="newName" placeholder="Add a project…" autocomplete="off" required />
      <label class="sr-only" for="newStatus">Status</label>
      <select id="newStatus">
        <option value="active">Active</option>
        <option value="blocked">Blocked</option>
        <option value="paused">Paused</option>
        <option value="done">Done</option>
      </select>
      <button type="submit" class="primary">Add</button>
    </div>
    <label class="sr-only" for="newComment">Comment</label>
    <textarea id="newComment" placeholder="Add a comment (optional)…"></textarea>
  </form>

  <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>

  <div class="list" id="list"></div>

  <div class="sync-panel" id="syncPanel"></div>

  <div class="toolbar">
    <p class="storage-note">Always saved in this browser. Export a backup now and then, or set up GitHub sync below to share across devices.</p>
    <button type="button" class="small" id="exportBtn">Export backup</button>
    <button type="button" class="small" id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json" />
    <button type="button" class="small ghost" id="clearBtn">Clear all</button>
  </div>
</div>

<script>
(function () {
  var STORE_KEY = "focus.projects.v1";
  var TOKEN_KEY = "focus.sync.token";
  var STATUSES = ["active", "blocked", "paused", "done"];
  var STATUS_LABEL = { active: "Active", blocked: "Blocked", paused: "Paused", done: "Done" };
  var STATUS_ORDER = { active: 0, blocked: 1, paused: 2, done: 3 };

  var GH_OWNER = "JayDubTX";
  var GH_REPO = "ClaudeMobile";
  var GH_BRANCH = "main";
  var GH_PATH = "data/projects.json";

  var state = {
    projects: load(),
    filter: "all",
    openId: null,
    editingId: null
  };

  var sync = {
    status: getToken() ? "syncing" : "off", // off | syncing | synced | error
    detail: null,
    lastSyncAt: null,
    showConnectForm: false
  };
  var syncTimer = null;

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.warn("Could not read saved projects:", e);
      return [];
    }
  }

  function persistLocal() {
    localStorage.setItem(STORE_KEY, JSON.stringify(state.projects));
  }

  function save() {
    persistLocal();
    scheduleSync();
  }

  function getToken() {
    return localStorage.getItem(TOKEN_KEY) || "";
  }

  function setToken(t) {
    localStorage.setItem(TOKEN_KEY, t);
  }

  function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
  }

  function uid() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function nowISO() {
    return new Date().toISOString();
  }

  function relTime(iso) {
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.round(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    var days = Math.round(hrs / 24);
    if (days < 30) return days + "d ago";
    var months = Math.round(days / 30);
    if (months < 12) return months + "mo ago";
    return Math.round(months / 12) + "y ago";
  }

  function fmtTs(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " +
      d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function addProject(name, status, comment) {
    var ts = nowISO();
    var project = {
      id: uid(),
      name: name,
      status: status,
      notes: [],
      createdAt: ts,
      updatedAt: ts
    };
    var commentText = (comment || "").trim();
    if (commentText) {
      project.notes.push({ id: uid(), text: commentText, ts: ts });
    }
    state.projects.push(project);
    save();
    render();
  }

  function touchProject(p) {
    p.updatedAt = nowISO();
  }

  function editProject(id, name, comment) {
    var p = state.projects.find(function (x) { return x.id === id; });
    if (!p) return;
    var trimmedName = name.trim();
    if (!trimmedName) return;
    var renamed = trimmedName !== p.name;
    p.name = trimmedName;
    var commentText = (comment || "").trim();
    if (commentText) {
      p.notes.unshift({ id: uid(), text: commentText, ts: nowISO() });
    } else if (renamed) {
      p.notes.unshift({ id: uid(), text: 'Renamed to "' + trimmedName + '"', ts: nowISO() });
    }
    touchProject(p);
    save();
    render();
  }

  function setStatus(id, status) {
    var p = state.projects.find(function (x) { return x.id === id; });
    if (!p) return;
    p.status = status;
    touchProject(p);
    save();
    render();
  }

  function deleteProject(id) {
    if (!confirm("Delete this project and its notes? This can't be undone.")) return;
    state.projects = state.projects.filter(function (x) { return x.id !== id; });
    save();
    render();
  }

  function addNote(id, text) {
    var p = state.projects.find(function (x) { return x.id === id; });
    if (!p || !text.trim()) return;
    p.notes.unshift({ id: uid(), text: text.trim(), ts: nowISO() });
    touchProject(p);
    save();
    render();
  }

  function deleteNote(projectId, noteId) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p) return;
    p.notes = p.notes.filter(function (n) { return n.id !== noteId; });
    save();
    render();
  }

  // --- GitHub-backed sync -------------------------------------------------
  // Uses the GitHub Contents API to read/write GH_PATH in GH_OWNER/GH_REPO
  // as the shared store. Last write wins: this app assumes one device edits
  // at a time, and doesn't attempt to merge concurrent conflicting edits.

  function b64EncodeUtf8(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  function b64DecodeUtf8(b64) {
    return decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));
  }

  function ghHeaders() {
    return {
      "Authorization": "Bearer " + getToken(),
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }

  function ghContentsUrl() {
    return "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + GH_PATH;
  }

  function ghErrorFromResponse(res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      if (res.status === 401 || res.status === 403) {
        return new Error("GitHub rejected this token (HTTP " + res.status + "). Check it has Contents: Read and write access to " + GH_OWNER + "/" + GH_REPO + ".");
      }
      return new Error(body.message || ("GitHub returned HTTP " + res.status));
    });
  }

  function ghGetFile() {
    return fetch(ghContentsUrl() + "?ref=" + GH_BRANCH, { headers: ghHeaders() }).then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) return ghErrorFromResponse(res).then(function (err) { throw err; });
      return res.json().then(function (data) {
        return { sha: data.sha, text: b64DecodeUtf8(data.content) };
      });
    });
  }

  function setSyncStatus(status, detail) {
    sync.status = status;
    sync.detail = detail || null;
    if (status === "synced") sync.lastSyncAt = nowISO();
    renderSync();
  }

  function scheduleSync() {
    if (!getToken()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { pushToGitHub(); }, 1200);
  }

  function pushToGitHub(isRetry) {
    if (!getToken()) return Promise.resolve();
    setSyncStatus("syncing");
    return ghGetFile().then(function (current) {
      return fetch(ghContentsUrl(), {
        method: "PUT",
        headers: ghHeaders(),
        body: JSON.stringify({
          message: "Update projects — " + nowISO(),
          content: b64EncodeUtf8(JSON.stringify(state.projects, null, 2)),
          branch: GH_BRANCH,
          sha: current ? current.sha : undefined
        })
      });
    }).then(function (res) {
      if (res.status === 409 && !isRetry) return pushToGitHub(true);
      if (!res.ok) return ghErrorFromResponse(res).then(function (err) { throw err; });
      setSyncStatus("synced");
    }).catch(function (err) {
      setSyncStatus("error", err.message);
    });
  }

  function pullFromGitHub() {
    if (!getToken()) return Promise.resolve();
    setSyncStatus("syncing");
    return ghGetFile().then(function (file) {
      if (file) {
        var parsed = JSON.parse(file.text);
        if (Array.isArray(parsed)) {
          state.projects = parsed;
          persistLocal();
        }
      }
      setSyncStatus("synced");
      render();
    }).catch(function (err) {
      setSyncStatus("error", err.message);
    });
  }

  function connectSync(token) {
    setToken(token);
    setSyncStatus("syncing");
    ghGetFile().then(function (file) {
      if (file) {
        var parsed = JSON.parse(file.text);
        var remote = Array.isArray(parsed) ? parsed : [];
        if (state.projects.length && remote.length) {
          var useRemote = confirm(
            "GitHub already has " + remote.length + " project(s) saved. Load those and replace what's in this browser (" +
            state.projects.length + ")?\n\nChoose Cancel to instead push this browser's data to GitHub, overwriting it there."
          );
          if (useRemote) {
            state.projects = remote;
            persistLocal();
            return null;
          }
          return pushNow(file.sha);
        }
        if (remote.length) {
          state.projects = remote;
          persistLocal();
          return null;
        }
        return pushNow(file.sha);
      }
      return pushNow();
    }).then(function () {
      setSyncStatus("synced");
      sync.showConnectForm = false;
      render();
    }).catch(function (err) {
      clearToken();
      setSyncStatus("off", err.message);
      alert("Could not connect: " + err.message);
    });

    function pushNow(shaToUse) {
      return fetch(ghContentsUrl(), {
        method: "PUT",
        headers: ghHeaders(),
        body: JSON.stringify({
          message: "Update projects — " + nowISO(),
          content: b64EncodeUtf8(JSON.stringify(state.projects, null, 2)),
          branch: GH_BRANCH,
          sha: shaToUse
        })
      }).then(function (res) {
        if (!res.ok) return ghErrorFromResponse(res).then(function (err) { throw err; });
      });
    }
  }

  function disconnectSync() {
    if (!confirm("Stop syncing this browser with GitHub? Your projects stay saved locally.")) return;
    clearToken();
    clearTimeout(syncTimer);
    setSyncStatus("off");
    render();
  }

  function renderStats() {
    var counts = { active: 0, blocked: 0, paused: 0, done: 0 };
    state.projects.forEach(function (p) { if (counts[p.status] !== undefined) counts[p.status]++; });
    var el = document.getElementById("stats");
    el.innerHTML = STATUSES.map(function (s) {
      return '<div class="stat"><span class="n">' + counts[s] + '</span><span class="l">' + STATUS_LABEL[s] + "</span></div>";
    }).join("");
  }

  function renderFilters() {
    var el = document.getElementById("filters");
    var options = [{ key: "all", label: "All" }].concat(STATUSES.map(function (s) { return { key: s, label: STATUS_LABEL[s] }; }));
    el.innerHTML = options.map(function (o) {
      var pressed = state.filter === o.key ? "true" : "false";
      return '<button type="button" class="chip" data-filter="' + o.key + '" aria-pressed="' + pressed + '">' + o.label + "</button>";
    }).join("");
  }

  function visibleProjects() {
    var list = state.projects.slice();
    if (state.filter !== "all") list = list.filter(function (p) { return p.status === state.filter; });
    list.sort(function (a, b) {
      var so = STATUS_ORDER[a.status] - STATUS_ORDER[b.status];
      if (so !== 0) return so;
      return new Date(b.updatedAt) - new Date(a.updatedAt);
    });
    return list;
  }

  function renderList() {
    var el = document.getElementById("list");
    var items = visibleProjects();

    if (state.projects.length === 0) {
      el.innerHTML = '<div class="empty">No projects yet. Add the first one above.</div>';
      return;
    }
    if (items.length === 0) {
      el.innerHTML = '<div class="empty">Nothing in this filter.</div>';
      return;
    }

    el.innerHTML = items.map(renderCard).join("");
  }

  function renderCard(p) {
    var open = state.openId === p.id;
    var editing = state.editingId === p.id;
    var statusButtons = STATUSES.map(function (s) {
      var active = s === p.status ? ' style="border-color: var(--ink); font-weight:600;"' : "";
      return '<button type="button" class="small status-btn" data-id="' + p.id + '" data-status="' + s + '"' + active + ">" + STATUS_LABEL[s] + "</button>";
    }).join("");

    var notesHtml = p.notes.length
      ? p.notes.map(function (n) {
          return '<div class="note-row"><span class="ts">' + fmtTs(n.ts) + '</span><span class="txt">' + escapeHtml(n.text) +
            '</span><button type="button" class="ghost small del" data-project="' + p.id + '" data-note="' + n.id + '" aria-label="Delete note">✕</button></div>';
        }).join("")
      : '<p style="color: var(--muted); font-size: 0.85rem; margin: 4px 0 10px;">No notes yet.</p>';

    var editHtml = editing
      ? '<form class="edit-project" data-id="' + p.id + '">' +
          '<label class="sr-only" for="edit-name-' + p.id + '">Project name</label>' +
          '<input type="text" id="edit-name-' + p.id + '" value="' + escapeHtml(p.name) + '" required autocomplete="off" />' +
          '<label class="sr-only" for="edit-comment-' + p.id + '">Comment</label>' +
          '<textarea id="edit-comment-' + p.id + '" placeholder="Comment on this change (optional)…"></textarea>' +
          '<div class="edit-actions">' +
            '<button type="submit" class="small primary">Save</button>' +
            '<button type="button" class="small ghost" data-cancel-edit="' + p.id + '">Cancel</button>' +
          "</div>" +
        "</form>"
      : "";

    return (
      '<div class="card' + (open ? " open" : "") + '" data-id="' + p.id + '">' +
        '<div class="card-head" data-toggle="' + p.id + '">' +
          '<div class="grow">' +
            '<p class="name">' + escapeHtml(p.name) + "</p>" +
            '<div class="meta"><span class="pill ' + p.status + '">' + STATUS_LABEL[p.status] + "</span>" +
            '<span class="updated">updated ' + relTime(p.updatedAt) + "</span>" +
            (p.notes.length ? "<span>&middot; " + p.notes.length + " note" + (p.notes.length === 1 ? "" : "s") + "</span>" : "") +
            "</div>" +
          "</div>" +
          '<span class="chevron">&#9656;</span>' +
        "</div>" +
        '<div class="body">' +
          editHtml +
          '<div class="status-row">' + statusButtons + "</div>" +
          '<div class="notes">' + notesHtml + "</div>" +
          '<form class="add-note" data-id="' + p.id + '">' +
            '<label class="sr-only" for="note-' + p.id + '">Add a note</label>' +
            '<textarea id="note-' + p.id + '" placeholder="Log a quick update…"></textarea>' +
            '<button type="submit" class="small primary">Log</button>' +
          "</form>" +
          '<div class="action-row" style="margin-top:12px;">' +
            '<button type="button" class="small" data-edit="' + p.id + '">Edit</button>' +
            '<button type="button" class="small ghost" data-delete="' + p.id + '">Delete project</button>' +
          "</div>" +
        "</div>" +
      "</div>"
    );
  }

  function renderSync() {
    var el = document.getElementById("syncPanel");
    if (!el) return;

    var statusLabel = {
      off: "Not synced",
      syncing: "Syncing…",
      synced: "Synced" + (sync.lastSyncAt ? " " + fmtTs(sync.lastSyncAt) : ""),
      error: "Sync error"
    }[sync.status];

    var head =
      '<div class="sync-head">' +
        '<p class="sync-title">Sync across devices</p>' +
        '<span class="sync-dot ' + sync.status + '">' + statusLabel + "</span>" +
      "</div>";

    var errorLine = sync.status === "error" && sync.detail
      ? '<p class="sync-help" style="color: var(--blocked);">' + escapeHtml(sync.detail) + "</p>"
      : "";

    if (!getToken()) {
      el.innerHTML = head +
        '<p class="sync-help">Connect this browser to ' + GH_OWNER + "/" + GH_REPO +
          " on GitHub so your projects follow you between devices.</p>" +
        errorLine +
        (sync.showConnectForm
          ? '<form class="sync-connect" id="syncConnectForm">' +
              '<label class="sr-only" for="syncToken">GitHub personal access token</label>' +
              '<input type="password" id="syncToken" placeholder="Fine-grained token with Contents: Read and write on ' + GH_OWNER + "/" + GH_REPO + '…" autocomplete="off" required />' +
              '<p class="sync-help">Create one at github.com/settings/personal-access-tokens/new, scoped to just this repository.</p>' +
              '<div class="sync-actions">' +
                '<button type="submit" class="small primary">Connect</button>' +
                '<button type="button" class="small ghost" id="syncCancelConnect">Cancel</button>' +
              "</div>" +
            "</form>"
          : '<div class="sync-actions"><button type="button" class="small" id="syncStart">Set up GitHub sync</button></div>');
      return;
    }

    el.innerHTML = head + errorLine +
      '<div class="sync-actions">' +
        '<button type="button" class="small" id="syncNow">Sync now</button>' +
        '<button type="button" class="small ghost" id="syncDisconnect">Disconnect</button>' +
      "</div>";
  }

  function render() {
    renderStats();
    renderFilters();
    renderList();
    renderSync();
  }

  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var nameInput = document.getElementById("newName");
    var statusInput = document.getElementById("newStatus");
    var commentInput = document.getElementById("newComment");
    var name = nameInput.value.trim();
    if (!name) return;
    addProject(name, statusInput.value, commentInput.value);
    nameInput.value = "";
    commentInput.value = "";
    nameInput.focus();
  });

  document.getElementById("filters").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-filter]");
    if (!btn) return;
    state.filter = btn.getAttribute("data-filter");
    render();
  });

  document.getElementById("list").addEventListener("click", function (e) {
    var toggle = e.target.closest("[data-toggle]");
    if (toggle) {
      var id = toggle.getAttribute("data-toggle");
      var closing = state.openId === id;
      state.openId = closing ? null : id;
      if (closing && state.editingId === id) state.editingId = null;
      render();
      return;
    }
    var statusBtn = e.target.closest(".status-btn");
    if (statusBtn) {
      setStatus(statusBtn.getAttribute("data-id"), statusBtn.getAttribute("data-status"));
      return;
    }
    var editBtn = e.target.closest("[data-edit]");
    if (editBtn) {
      state.editingId = editBtn.getAttribute("data-edit");
      render();
      return;
    }
    var cancelEdit = e.target.closest("[data-cancel-edit]");
    if (cancelEdit) {
      state.editingId = null;
      render();
      return;
    }
    var delBtn = e.target.closest("[data-delete]");
    if (delBtn) {
      deleteProject(delBtn.getAttribute("data-delete"));
      return;
    }
    var noteDel = e.target.closest(".del[data-note]");
    if (noteDel) {
      deleteNote(noteDel.getAttribute("data-project"), noteDel.getAttribute("data-note"));
      return;
    }
  });

  document.getElementById("list").addEventListener("submit", function (e) {
    var noteForm = e.target.closest(".add-note");
    if (noteForm) {
      e.preventDefault();
      var id = noteForm.getAttribute("data-id");
      var textarea = noteForm.querySelector("textarea");
      addNote(id, textarea.value);
      return;
    }
    var editForm = e.target.closest(".edit-project");
    if (editForm) {
      e.preventDefault();
      var editId = editForm.getAttribute("data-id");
      var nameInput = editForm.querySelector('input[type="text"]');
      var commentInput = editForm.querySelector("textarea");
      state.editingId = null;
      editProject(editId, nameInput.value, commentInput.value);
      return;
    }
  });

  document.getElementById("syncPanel").addEventListener("click", function (e) {
    if (e.target.closest("#syncStart")) {
      sync.showConnectForm = true;
      renderSync();
      return;
    }
    if (e.target.closest("#syncCancelConnect")) {
      sync.showConnectForm = false;
      renderSync();
      return;
    }
    if (e.target.closest("#syncNow")) {
      clearTimeout(syncTimer);
      pushToGitHub().then(function () { return pullFromGitHub(); });
      return;
    }
    if (e.target.closest("#syncDisconnect")) {
      disconnectSync();
      return;
    }
  });

  document.getElementById("syncPanel").addEventListener("submit", function (e) {
    var form = e.target.closest("#syncConnectForm");
    if (!form) return;
    e.preventDefault();
    var tokenInput = document.getElementById("syncToken");
    var token = tokenInput.value.trim();
    if (!token) return;
    connectSync(token);
  });

  function offerDownload(filename, dataStr) {
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: filename, data: dataStr }).catch(function (err) {
        console.warn("Download declined or failed:", err);
        fallbackDownload(filename, dataStr);
      });
    } else {
      fallbackDownload(filename, dataStr);
    }
  }

  function fallbackDownload(filename, dataStr) {
    var blob = new Blob([dataStr], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("exportBtn").addEventListener("click", function () {
    var dataStr = JSON.stringify(state.projects, null, 2);
    var stamp = new Date().toISOString().slice(0, 10);
    offerDownload("focus-projects-" + stamp + ".json", dataStr);
  });

  document.getElementById("importBtn").addEventListener("click", function () {
    document.getElementById("importFile").click();
  });

  document.getElementById("importFile").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("Not a project list");
        if (state.projects.length && !confirm("Replace your current " + state.projects.length + " project(s) with the " + parsed.length + " from this backup?")) return;
        state.projects = parsed;
        save();
        render();
      } catch (err) {
        alert("Could not read that file as a Focus backup: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    if (!state.projects.length) return;
    if (!confirm("Delete all " + state.projects.length + " project(s)? This can't be undone.")) return;
    state.projects = [];
    save();
    render();
  });

  render();
  if (getToken()) pullFromGitHub();
})();
</script>
</body>
</html>
